name: build and test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pipenv
        run: python -m pip install --upgrade pip pipenv

      - name: Install dependencies
        # --python forces pipenv to use the matrix interpreter instead of the
        # version pinned in Pipfile; --skip-lock avoids regenerating Pipfile.lock.
        run: pipenv install --dev --python ${{ matrix.python-version }} --skip-lock

      - name: Run tests
        run: pipenv run python -m pytest -v

      - name: Build package
        run: pipenv run python -m build

      - name: Check built artifacts
        run: pipenv run python -m twine check dist/*
